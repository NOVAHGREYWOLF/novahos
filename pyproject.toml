[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novahos"
version = "0.3.0"
description = "The NovahOS kernel — rails (service mesh + knowledge) + foundation (constitution/consent/privacy/warden/validators/mcp) + shared agents + channels. One foundation every NOVAH app runs on."
requires-python = ">=3.11"
dependencies = []  # the rails + foundation are stdlib-only; heavy layers are extras.

[project.optional-dependencies]
# Substrate: DB + LLM gateway + learning + the WolfOS bridge.
substrate = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "river>=0.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
# Channels: posting backends.
channels = ["httpx>=0.27"]
# Agents: shared agents need the substrate + channels.
agents = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "river>=0.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
# Local transcription (optional even within agents — providers import lazily).
transcribe = ["faster-whisper>=1.0"]
# Everything.
all = [
    "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pydantic-settings>=2.3",
    "litellm>=1.40", "river>=0.21", "httpx>=0.27", "pyyaml>=6.0", "faster-whisper>=1.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyyaml>=6.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["novahos*", "leadfuel_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
